# Based on keycloak.v2 (PatternFly 5), the default login theme since Keycloak 24.
# The older "keycloak" (v1, PatternFly 3) login theme is legacy.
parent=keycloak.v2
import=common/keycloak
# "styles" replaces the parent's list, so keep css/styles.css from keycloak.v2
styles=css/styles.css css/mytheme.css
