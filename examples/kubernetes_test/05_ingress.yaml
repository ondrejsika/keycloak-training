apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-test
  namespace: keycloak-test
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-buffer-size: 128k
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - keycloak-test.sikademo.com
      secretName: keycloak-test.sikademo.com-tls
  rules:
    - host: keycloak-test.sikademo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak-test-service
                port:
                  name: http
