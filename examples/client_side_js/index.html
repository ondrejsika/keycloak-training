<!DOCTYPE html>
<html>
  <head>
    <title>Keycloak Example Application</title>
    <script type="module">
      import Keycloak from "https://unpkg.com/keycloak-js@26.2.5/lib/keycloak.js";

      const kc = new Keycloak({
        url: "https://keycloak.sikademo.com",
        realm: "example",
        clientId: "example",
      });

      function output(content) {
        if (typeof content === "object") {
          content = JSON.stringify(content, null, 2);
        }
        document.getElementById("output").textContent = content;
      }

      function outputRawToken(content) {
        const textarea = document.createElement("textarea");
        textarea.cols = 120;
        textarea.rows = 20;
        textarea.value = content;
        document.getElementById("output").replaceChildren(textarea);
      }

      function profile() {
        if (kc.idTokenParsed.name) {
          document.getElementById("name").textContent =
            "Hello " + kc.idTokenParsed.name + " (dep. " + kc.idTokenParsed.department + ")";
        }
        document.getElementById("user").style.display = "block";
      }

      async function sendRequest(path) {
        try {
          const res = await fetch("http://localhost:8001" + path, {
            headers: { Authorization: "Bearer " + kc.token },
          });
          output(res.status + "\n\n" + (await res.text()));
        } catch (err) {
          output("Request failed: " + err);
        }
      }

      const actions = {
        login: () => kc.login(),
        logout: () => kc.logout(),
        idToken: () => output(kc.idTokenParsed),
        accessToken: () => output(kc.tokenParsed),
        rawToken: () => outputRawToken(kc.token),
        refresh: async () => {
          await kc.updateToken(-1);
          output(kc.idTokenParsed);
          profile();
        },
      };

      document.addEventListener("click", (e) => {
        const button = e.target.closest("button");
        if (!button) return;
        if (button.dataset.action) actions[button.dataset.action]();
        if (button.dataset.path) sendRequest(button.dataset.path);
      });

      const authenticated = await kc.init({
        onLoad: "check-sso",
        pkceMethod: "S256",
      });
      if (authenticated) {
        profile();
      } else {
        document.getElementById("anonymous").style.display = "block";
      }
    </script>
  </head>
  <body>
    <div id="anonymous" style="display: none">
      <button data-action="login">Login</button>
    </div>

    <div id="user" style="display: none">
      <button data-action="logout">Logout</button>
      <button data-action="idToken">Show ID Token</button>
      <button data-action="accessToken">Show Access Token</button>
      <button data-action="rawToken">Show RAW Access Token</button>
      <button data-action="refresh">Refresh</button>
      <button data-path="/edit">/edit</button>
      <button data-path="/view">/view</button>
      <button data-path="/administrator">/administrator</button>
      <button data-path="/uzivatel">/uzivatel</button>
      <h1 id="name"></h1>
      <pre id="output"></pre>
    </div>
  </body>
</html>
